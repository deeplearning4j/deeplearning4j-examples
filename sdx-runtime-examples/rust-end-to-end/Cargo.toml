[package]
name = "sdx-runtime-end-to-end"
version = "0.1.0"
edition = "2021"
description = "End-to-end SDX runtime example: load a .sdz and run it through the sdx* C ABI from pure Rust (no JVM)"
license = "Apache-2.0"

[[bin]]
name = "end_to_end"
path = "src/main.rs"

# LLM/VLM/STT end-to-end example using the AOT libsdx_llm C ABI.
# Build and run:
#
#   export SDX_LLM_AOT_HOME=/tmp/sdx-cpu-v8
#   SDX_LLM_LIB_DIR=$SDX_LLM_AOT_HOME/lib \
#     LD_LIBRARY_PATH=$SDX_LLM_AOT_HOME/lib \
#     cargo run --release --bin llm
#
[[bin]]
name = "llm"
path = "src/bin/llm.rs"

[dependencies]
# The SDX Rust wrapper crate. This path assumes a sibling `deeplearning4j`
# checkout next to this examples repository; when building against an unpacked
# SDK package instead, point it at <sdk>/wrappers/rust.
# Add features = ["standalone"] to link the JVM-free libsdx_cpu runtime.
# The `llm` feature wires in sdx_runtime::llm (libsdx_llm.so); it is kept
# here alongside `ndarray` so both binaries (end_to_end, llm) are covered.
sdx-runtime = { path = "../../../deeplearning4j/libnd4j/include/dsp/runtime/bindings/rust", features = ["ndarray", "llm"] }
ndarray = "0.16"
